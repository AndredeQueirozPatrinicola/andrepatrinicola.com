name: Deploy website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  # Never stop a deploy halfway through the upload.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://${{ vars.AWS_CLOUDFRONT_DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build all applications
        run: npm run build
        env:
          # Public origin for canonical URLs, Open Graph and the sitemap.
          # Empty uses the CloudFront address (see apps/site/src/seo/site.ts).
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          # Without both, the contact form is not rendered.
          VITE_CONTACT_API_URL: ${{ vars.CONTACT_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Verify deployment package
        run: |
          test -f .deploy/index.html || {
            echo "Erro: .deploy/index.html não foi encontrado."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-personal-website

      # Hashed assets first (cached for a year), then HTML and everything else
      # (always revalidated), so a new page never references a missing file.
      # Old hashed assets are kept (no --delete) so pages and tabs opened
      # before this deploy can still load their files; they are tiny.
      - name: Deploy hashed assets to S3
        run: |
          aws s3 sync ./.deploy "s3://${{ vars.AWS_S3_BUCKET }}" \
            --exclude "*" \
            --include "assets/*" \
            --include "play/*/assets/*" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

      - name: Deploy pages and other files to S3
        run: |
          aws s3 sync ./.deploy "s3://${{ vars.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "assets/*" \
            --exclude "play/*/assets/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --only-show-errors

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(
            aws cloudfront create-invalidation \
              --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/*" \
              --query "Invalidation.Id" \
              --output text
          )

          echo "CloudFront invalidation criada: ${INVALIDATION_ID}"

      - name: Deployment summary
        run: |
          {
            echo "## Deploy concluído"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Bucket: \`${{ vars.AWS_S3_BUCKET }}\`"
            echo "- CloudFront: \`${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}\`"
            echo "- URL: https://${{ vars.AWS_CLOUDFRONT_DOMAIN }}"
          } >> "$GITHUB_STEP_SUMMARY"
