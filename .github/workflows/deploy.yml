name: Deploy website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://${{ vars.AWS_CLOUDFRONT_DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Verify build output
        run: |
          test -f apps/site/dist/index.html || {
            echo "Erro: apps/site/dist/index.html não foi encontrado."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-personal-website

      - name: Deploy to S3
        run: |
          aws s3 sync ./apps/site/dist "s3://${{ vars.AWS_S3_BUCKET }}" \
            --delete \
            --only-show-errors

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(
            aws cloudfront create-invalidation \
              --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/*" \
              --query "Invalidation.Id" \
              --output text
          )

          echo "CloudFront invalidation criada: ${INVALIDATION_ID}"

      - name: Deployment summary
        run: |
          {
            echo "## Deploy concluído"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Bucket: \`${{ vars.AWS_S3_BUCKET }}\`"
            echo "- CloudFront: \`${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}\`"
            echo "- URL: https://${{ vars.AWS_CLOUDFRONT_DOMAIN }}"
          } >> "$GITHUB_STEP_SUMMARY"
