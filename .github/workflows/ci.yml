name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build all applications
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          # The end-to-end tests stub this API and the Turnstile script.
          VITE_CONTACT_API_URL: https://api.example.test/contact
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Verify deployment package
        run: |
          test -f .deploy/index.html || {
            echo "Erro: .deploy/index.html não foi encontrado."
            exit 1
          }
